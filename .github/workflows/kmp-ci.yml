name: KMP Android CI

on:
  pull_request:
    branches: [ develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Clean and build Android app
        run: ./gradlew clean :androidApp:assembleDebug

      - name: Run unit tests
        run: ./gradlew :shared:testAndroid :androidApp:test

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/app-debug.apk
